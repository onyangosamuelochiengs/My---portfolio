<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search any city to see its current weather and a 5-day forecast.">
    <title>Weather App | Samuel's Portfolio</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header class="navbar">
        <a href="../index.html" class="logo">Samuel | IT Portfolio</a>
        <nav class="nav-links" aria-label="Main navigation">
            <a href="../index.html#home">Home</a>
            <a href="../index.html#projects">Projects</a>
            <a href="../index.html#about">About</a>
            <a href="../index.html#contact">Contact</a>
        </nav>
    </header>

    <main>
        <div class="page-intro">
            <h1>Weather App</h1>
            <p>Search for a city to see its current weather and a 5-day forecast.</p>
        </div>

        <div class="app-card weather-card">
            <div class="search-row">
                <input type="text" id="cityInput" placeholder="Enter city name..." aria-label="City name">
                <button id="searchBtn">Search</button>
            </div>

            <div class="weather-info" aria-live="polite">
                <h3 id="cityName"></h3>
                <div class="temp" id="temperature"></div>
                <p id="description"></p>
                <div class="details" id="details"></div>
                <p id="status">Type a city above and press Search.</p>
            </div>

            <div class="forecast-wrap" id="forecastWrap" hidden>
                <h4 class="forecast-title">5-day forecast</h4>
                <div class="forecast" id="forecast"></div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
